<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Title</title>

        <!-- CSS Stylesheet -->
        <link rel="stylesheet" type="text/css" href="./styles/style.css" />
    </head>
    <body>
        <div class="main-container">
            <button class="mission" onclick="toggleMission()">Mission</button>
            <div class="panel-container">
                <div class="options-container">
                    <div class="feeling-option option" data-value="lonely">
                        lonely
                    </div>
                    <div
                        class="feeling-option option active"
                        data-value="overwhelmed"
                    >
                        overwhelmed
                    </div>
                    <div class="feeling-option option" data-value="curious">
                        curious
                    </div>
                    <div class="feeling-option option" data-value="unmotivated">
                        unmotivated
                    </div>
                    <div class="feeling-option option" data-value="upset">
                        upset
                    </div>
                    <div class="feeling-option option" data-value="thoughtful">
                        thoughtful
                    </div>
                </div>
                <div class="options-container">
                    <div class="intention-option option" data-value="learn">
                        learn
                    </div>
                    <div class="intention-option option" data-value="connect">
                        connect
                    </div>
                    <div class="intention-option option" data-value="calm">
                        calm
                    </div>
                    <div
                        class="intention-option option active"
                        data-value="reflect"
                    >
                        reflect
                    </div>
                    <div class="intention-option option" data-value="inspire">
                        inspire
                    </div>
                </div>
            </div>
            <button class="suggest-btn" onclick="updateRecommendation()">
                Suggest Resource
            </button>
        </div>

        <div class="modal hidden">
            <div class="modal-content">
                <button class="close-btn">X</button>
                <div class="thumbnail-container">
                    <img src="" class="thumbnail" alt="Thumbnail" />
                </div>
                <div class="info">
                    <div class="title">Title</div>
                    <div class="description">
                        Lorem ipsum dolor sit amet consectetur adipisicing elit.
                        Molestias illo beatae ad ipsa ipsum!.
                    </div>
                    <a href="" target="_blank" class="link">Go to Resource</a>
                </div>
            </div>
        </div>
        <!-- JS Script(s) -->
        <script src="./scripts/script.js"></script>
    </body>
</html>
